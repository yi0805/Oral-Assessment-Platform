name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
      STORAGE_BACKEND: s3
      S3_BUCKET_NAME: ci-test-bucket
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_EC2_METADATA_DISABLED: "true"
      GEMINI_API_KEY: ci-placeholder
      OPENROUTER_API_KEY: ci-placeholder
      TRANSCRIBE_ENABLED: "false"
      STT_STREAMING_ENABLED: "false"
      GOOGLE_INSTRUCTOR_DOMAINS: example.edu
      GOOGLE_INSTRUCTOR_ALLOWLIST: instructor@example.edu
      GOOGLE_ALLOWED_LOGIN_DOMAINS: example.edu
      JWT_SECRET_KEY: ci-only-not-a-real-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "180"
      RATE_LIMIT_DEFAULT: "300"
      CORS_ORIGINS: '["http://localhost:5173"]'
      COOKIE_SECURE: "false"
      APP_VERSION: ci
      GIT_COMMIT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
